  <section class="hero">
    <span class="eyebrow">LEKTION 08 </span>
    <h1>Energi och hållbar IT</h1>
    <p>Beräkna hur datorns effekt och användningstid påverkar energiförbrukningen.</p>
  </section>
  <section class="card">
    <h2>Energikalkylator</h2>
    <label for="watts">Datorns genomsnittliga effekt (W)</label>
    <input id="watts" type="number" min="1" max="2000" value="150">
    <label for="hours">Användning per dag (timmar)</label>
    <input id="hours" type="number" min="0" max="24" step="0.5" value="5">
    <label for="price">Elpris (kr/kWh)</label>
    <input id="price" type="number" min="0" max="20" step="0.1" value="2">
    <button id="calculate">Beräkna</button>
    <div id="result" class="feedback" aria-live="polite"></div>
  </section>
  <section class="card">
    <h2>Hållbarhetsutmaning</h2>
    <div id="exercise"></div>
    <button id="checkAnswers">Kontrollera</button>
    <button id="resetAnswers">Gör om</button>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </section>
