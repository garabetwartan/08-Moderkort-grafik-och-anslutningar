
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <title>Presentation | IT Lab – Lektion 08</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    .presentation-card {
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e1e7f3;
      border-radius: 20px;
      margin: 25px 0;
    }

    .presentation-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .presentation-progress {
      flex: 1;
      height: 9px;
      border-radius: 20px;
      background: #e9edff;
      overflow: hidden;
    }

    #bar {
      height: 100%;
      width: 0;
      background: #5148d8;
      transition: width .3s ease;
    }

    .slide-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
    }

    .slide-text h2 {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      color: #202b4a;
      margin: 12px 0 22px;
    }

    .slide-text ul {
      padding-left: 22px;
      line-height: 1.9;
      color: #344360;
    }

    .slide-text li {
      margin-bottom: 12px;
    }

    .slide-image {
      background: #f0f4ff;
      border-radius: 18px;
      padding: 20px;
      min-height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide-image svg {
      width: 100%;
      max-width: 440px;
      height: auto;
    }

    .image-caption {
      text-align: center;
      color: #64748b;
      font-size: .85rem;
      margin-top: 10px;
    }

    .discussion {
      background: #eaf7f5;
      border-left: 5px solid #12a594;
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 25px;
    }

    .discussion strong {
      color: #087f73;
    }

    .presentation-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .presentation-controls button {
      background: #5148d8;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .presentation-controls button:disabled {
      background: #c9cee3;
      cursor: not-allowed;
    }

    .presentation-controls button:focus-visible {
      outline: 3px solid #12a594;
      outline-offset: 3px;
    }

    .presentation-controls .btn {
      background: #e9edff;
      color: #3730a3;
    }

    @media (max-width: 750px) {
      .slide-layout {
        grid-template-columns: 1fr;
      }

      .presentation-card {
        padding: 18px;
      }

      .slide-image {
        min-height: 200px;
      }
    }
  </style>

  <script src="../js/presentation.js" defer></script>
</head>

<body>

<header>
  <a class="brand" href="../index.html">◈ IT LAB</a>
</header>

<main>

  <section class="hero">
    <span class="eyebrow">
      LEKTION 08 · INFORMATIONSTEKNIK 1
    </span>

    <h1>Moderkort, grafik och anslutningar</h1>

    <p>
      Utforska datorns viktigaste komponenter.
      Bläddra mellan sex teoribilder med
      illustrationer och korta förklaringar.
    </p>
  </section>

  <section class="presentation-card">

    <div class="presentation-top">
      <span id="counter" aria-live="polite">
        1 / 6
      </span>

      <div class="presentation-progress">
        <div id="bar"></div>
      </div>
    </div>

    <section id="slide"
             class="slide"
             aria-live="polite">
    </section>

    <div class="presentation-controls">
      <button id="prev" type="button">
        ← Föregående
      </button>

      <button id="next" type="button">
        Nästa →
      </button>

      <a class="btn" href="moderkort.html">
        Till uppgift 1 →
      </a>
    </div>

  </section>

</main>

<footer>
  Informationsteknik nivå 1 · Lektion 08 · Ingen inloggning
</footer>

</body>
</html>
